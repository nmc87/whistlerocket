name: Windows-installer

# Bij elke push naar main: testen en een Windows-installer bouwen (te downloaden bij de run).
# Bij een versietag (bijv. v0.1.0): ook een release met de installer op GitHub.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TZ: Europe/Amsterdam

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      - name: Installer bouwen (en release bij een versietag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: WhistleRocket ${{ github.ref_name }}
          releaseBody: Windows-installer voor eigen gebruik. Download het .exe-bestand hieronder en voer het uit.
          releaseDraft: false
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: WhistleRocket-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
