name: Windows-installer

# Bij elke push naar main: testen, een Windows-installer bouwen en die bij Releases zetten
# onder de versie uit package.json (bijv. v0.1.0). Zelfde versie = de release wordt bijgewerkt;
# hogere versie = een nieuwe release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TZ: Europe/Amsterdam

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci

      - name: Installer bouwen en bij Releases zetten
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: WhistleRocket v__VERSION__
          releaseBody: Windows-installer voor eigen gebruik. Download het .exe-bestand hieronder en voer het uit.
          releaseDraft: false
          prerelease: true

      - uses: actions/upload-artifact@v4
        with:
          name: WhistleRocket-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
